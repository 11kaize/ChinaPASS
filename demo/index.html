<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f0f3ef">
<meta name="description" content="Practical phrases and a clear checklist for getting around China. Save useful details and show Chinese phrases full screen.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<title>ChinaPASS · Your China travel companion</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app"></main>

  <!-- Full-screen phrase card to show a local contact. -->
  <div id="cardscreen" class="cs" hidden aria-hidden="true" role="dialog" aria-modal="true">
    <div class="cs__body" id="cs-body" tabindex="-1">
      <p class="cs__from" id="cs-from"></p>
      <p class="cs__zh" id="cs-zh"></p>
      <p class="cs__en" id="cs-en"></p>
    </div>
    <div class="cs__bar is-hidden" id="cs-bar" inert>
      <button class="cb" id="cs-close" aria-label="Close card">✕</button>
      <button class="cb" id="cs-prev" aria-label="Previous phrase">‹</button>
      <span class="cb cb--count" id="cs-count"></span>
      <button class="cb" id="cs-next" aria-label="Next phrase">›</button>
      <button class="cb cb--right" id="cs-toggle">Hide English</button>
      <button class="cb" id="cs-save" aria-label="Save phrase">☆ Save</button>
      <button class="cb cb--primary" id="cs-copy">Copy Chinese</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
