<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="China Cheat Sheet — 双语应急卡片。遇到说不通的情况，把手机递过去，让对方读中文。">
<title>应急卡片 · China Cheat Sheet</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main id="app" class="app"></main>

  <!-- 全屏卡片：只给中文，递给对方看 -->
  <div id="cardscreen" class="cs" hidden aria-hidden="true" role="dialog" aria-modal="true">
    <div class="cs__body" id="cs-body">
      <p class="cs__from" id="cs-from"></p>
      <p class="cs__zh" id="cs-zh"></p>
      <p class="cs__en" id="cs-en"></p>
    </div>
    <div class="cs__bar is-hidden" id="cs-bar">
      <button class="cb" id="cs-close" aria-label="关闭">✕</button>
      <button class="cb" id="cs-prev" aria-label="上一张">‹</button>
      <span class="cb cb--count" id="cs-count"></span>
      <button class="cb" id="cs-next" aria-label="下一张">›</button>
      <button class="cb cb--right" id="cs-toggle">隐藏英文</button>
      <button class="cb cb--primary" id="cs-copy">复制中文</button>
    </div>
  </div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
