name: Deploy demo to GitHub Pages

# 把 demo/ 目录发布成网站根目录。
# 访问地址：https://11kaize.github.io/ChinaPASS/
# 每次 push 到 main 都会自动重新发布。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，新的推送不打断正在进行的发布
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5
        with:
          # 首次运行自动开启 Pages，不需要手动去 Settings 点
          enablement: true

      - name: Upload demo folder as site
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./demo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
